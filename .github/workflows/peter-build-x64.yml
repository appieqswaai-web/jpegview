name: Peter build x64 (read-ahead window)

on:
  push:
    branches: [master, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: WTL includes submodule init
      shell: cmd
      run: git submodule update --init deps/WTL-sf

    - name: Put version in title
      shell: powershell
      run: |
        $ver = "$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
        echo "BUILD_VER=$ver" >> $env:GITHUB_ENV
        sed.exe -i -r -e "s/(#define JPEGVIEW_TITLE \`"JPEGView)(\`")/\1 Peter v$ver\2/g" src/JPEGView/resource.h
        Select-String -Path src/JPEGView/resource.h -Pattern "JPEGVIEW_TITLE"

    - name: Build
      shell: cmd
      run: msbuild.exe src\JPEGView.sln /t:WICLoader;JPEGView /m /property:Platform=x64 /property:Configuration=Release /property:PlatformToolset=v143

    - name: Clean up WICLoader files
      shell: bash
      run: |
        cd src/JPEGView/bin/x64/Release
        rm -f WICLoader.exp WICLoader.lib WICLoader.pdb
        ls -la

    - uses: actions/upload-artifact@v4
      with:
        name: JPEGView-Peter-x64-${{ env.BUILD_VER }}
        path: src/JPEGView/bin/x64/Release
